# Blueprint do Render para o back-end (Express). O front vai na Vercel (frontend/vercel.json).
# Render > New > Blueprint > apontar para este repositório. As variáveis com sync: false
# são preenchidas no painel do Render e nunca ficam no repositório.
services:
  - type: web
    name: mange-book-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Sem MONGO_URI o servidor sobe em modo demonstração: MongoDB embutido no
      # processo (mongodb-memory-server) + seed a cada subida. Para usar um Mongo de
      # verdade, acrescente MONGO_URI no painel do Render.
      - key: MONGOMS_VERSION
        value: "7.0.14"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://mange-books.vercel.app,https://diogusvincere.github.io,http://localhost:5173
    # Atenção: no plano free o disco é efêmero — as capas enviadas pelo multer somem a cada
    # deploy/reinício. Em plano pago, descomente para persistir backend/uploads:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

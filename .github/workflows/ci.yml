name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · testes de integração
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_VERSION: 7.0.14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências (baixa o MongoDB embutido)
        run: npm ci
      - name: Rodar testes
        run: npm test

  front:
    name: Front · build do Vite
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
